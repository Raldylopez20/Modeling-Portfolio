<!-- Script para el menú hamburguesa responsive y precarga instantánea -->
<script>
  const toggle = document.getElementById('menu-toggle');
  const navLinks = document.getElementById('nav-links');

  // Precarga instantánea de páginas al interactuar con el menú
  const prefetchUrl = (url) => {
    if (!url || url.startsWith('http') || url.startsWith('#') || url === window.location.pathname.split('/').pop()) return;
    if (document.querySelector(`link[rel="prefetch"][href="${url}"]`)) return;
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = url;
    document.head.appendChild(link);
  };

  toggle.addEventListener('click', () => {
    toggle.classList.toggle('active');
    navLinks.classList.toggle('active');
    if (navLinks.classList.contains('active')) {
      // Precargar todas las páginas del menú apenas se abre
      document.querySelectorAll('.nav-links a').forEach(a => prefetchUrl(a.getAttribute('href')));
    }
  });

  // Precargar al pasar el cursor o tocar cualquier enlace del menú
  document.querySelectorAll('.nav-links a').forEach(link => {
    link.addEventListener('mouseenter', () => prefetchUrl(link.getAttribute('href')), { passive: true });
    link.addEventListener('touchstart', () => prefetchUrl(link.getAttribute('href')), { passive: true });
  });
</script>
