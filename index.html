<!-- ====== Sistema SPA Ultra Rápido (Transiciones Instantáneas sin Recarga) ====== -->
<script>
(function() {
  const pageCache = new Map();

  function normalizePath(url) {
    if (!url) return 'index.html';
    const clean = url.split('?')[0].split('#')[0];
    const file = clean.split('/').pop();
    return (file === '' || file === '.' || file === './') ? 'index.html' : file;
  }

  async function preloadPage(url) {
    const norm = normalizePath(url);
    if (pageCache.has(norm)) return pageCache.get(norm);
    try {
      const res = await fetch(url);
      if (!res.ok) return null;
      const htmlText = await res.text();
      const doc = new DOMParser().parseFromString(htmlText, 'text/html');
      const contentEl = doc.getElementById('page-content');
      const title = doc.querySelector('title')?.innerText || document.title;
      if (contentEl) {
        const data = { html: contentEl.innerHTML, title };
        pageCache.set(norm, data);
        return data;
      }
    } catch (err) {
      console.warn('Preload failed for', url, err);
    }
    return null;
  }

  function rebindFancybox() {
    if (typeof Fancybox !== 'undefined') {
      try {
        Fancybox.unbind("[data-fancybox]");
        Fancybox.bind("[data-fancybox]", {
          compact: () => window.innerWidth < 768,
          animated: true,
          showClass: "f-fadeIn",
          hideClass: "f-fadeOut",
          dragToClose: true,
          Images: {
            initialSize: "fit",
            zoom: false, // Desactiva animación morph desde el trigger para evitar que se quede pequeña en móviles/Instagram
            Panzoom: {
              maxScale: 3,
            },
          },
          Thumbs: {
            autoStart: true,
            minCount: 2,
          },
          Toolbar: {
            display: {
              left: ["infobar"],
              middle: ["zoomIn", "zoomOut", "toggle1to1"],
              right: ["slideshow", "fullscreen", "download", "thumbs", "close"],
            },
          },
          preload: 2,
          wheel: "zoom",
          click: "toggleZoom",
          on: {
            "Carousel.change": (fancybox, carousel, to) => {
              const slide = carousel.slides ? carousel.slides[to] : null;
              if (slide && slide.panzoom) {
                slide.panzoom.updateMetrics();
                slide.panzoom.zoomToFit();
              }
            },
            "Carousel.settle": (fancybox, carousel) => {
              const slide = fancybox.getSlide();
              if (slide && slide.panzoom) {
                slide.panzoom.updateMetrics();
                slide.panzoom.zoomToFit();
              }
            },
            "ready": (fancybox) => {
              const slide = fancybox.getSlide();
              if (slide && slide.panzoom) {
                slide.panzoom.updateMetrics();
                slide.panzoom.zoomToFit();
              }
            }
          }
        });
      } catch (e) {
        console.error('Fancybox bind error', e);
      }
    }
  }

  async function spaNavigate(url, push = true) {
    const norm = normalizePath(url);
    const container = document.getElementById('page-content');
    if (!container) {
      window.location.href = url;
      return;
    }

    // Cerrar menú inmediatamente
    const toggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');
    if (toggle) toggle.classList.remove('active');
    if (navLinks) navLinks.classList.remove('active');

    container.style.opacity = '0.3';
    container.style.transition = 'opacity 0.08s ease';

    let data = pageCache.get(norm);
    if (!data) {
      data = await preloadPage(url);
    }

    if (data) {
      container.innerHTML = data.html;
      document.title = data.title;
      if (push) {
        history.pushState({ page: norm }, data.title, url);
      }
      window.scrollTo({ top: 0, behavior: 'instant' });
      rebindFancybox();
      container.style.opacity = '1';
    } else {
      window.location.href = url;
    }
  }

  function initSPA() {
    const currentKey = normalizePath(window.location.pathname);
    const contentEl = document.getElementById('page-content');
    if (contentEl) {
      pageCache.set(currentKey, {
        html: contentEl.innerHTML,
        title: document.title
      });
      if (currentKey === 'index.html') {
        pageCache.set('', { html: contentEl.innerHTML, title: document.title });
        pageCache.set('./', { html: contentEl.innerHTML, title: document.title });
      }
    }

    // Precargar todas las páginas en memoria de fondo
    ['index.html', 'fitness.html', 'lifestyle.html', 'about.html', 'contact.html'].forEach(p => {
      if (normalizePath(p) !== currentKey) {
        preloadPage(p);
      }
    });

    rebindFancybox();

    // Toggle del menú hamburguesa
    const toggle = document.getElementById('menu-toggle');
    const navLinks = document.getElementById('nav-links');
    if (toggle && navLinks) {
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        toggle.classList.toggle('active');
        navLinks.classList.toggle('active');
      });
    }

    // Interceptar clics en los enlaces del menú para cambio instantáneo (0ms)
    document.addEventListener('click', (e) => {
      const a = e.target.closest('.nav-links a');
      if (!a) return;
      const href = a.getAttribute('href');
      if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
      e.preventDefault();
      spaNavigate(href, true);
    });

    // Manejar botón Atrás / Adelante del navegador (incluyendo Instagram)
    window.addEventListener('popstate', (e) => {
      const target = (e.state && e.state.page) ? e.state.page : normalizePath(window.location.pathname);
      spaNavigate(target, false);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSPA);
  } else {
    initSPA();
  }
})();
</script>
